<script src="demo-api.js"></script><script>
const $=s=>document.querySelector(s), escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state={csrf:'',usuario:null,cursos:[],certificados:[],detalhes:{}};
async function api(action,data,params=''){
 if(typeof scDemoApi!=='function')throw Error('Não foi possível carregar os arquivos do site. Atualize a página com Ctrl+F5 e confira se o Netlify está publicando a branch netlify.');
 return scDemoApi(action,data,params);
}

function note(message,error=false){const n=$('#message');if(n){n.className='notice'+(error?' error':'');n.textContent=message;}}
async function refresh(){const result=await api('bootstrap');const previous=window.SCActiveUserId||'guest';state={...state,...result};window.SCActiveUserId=state.usuario?.id||'guest';if(previous!==window.SCActiveUserId)window.SCAccessibilityV2?.load();}
function nav(){
 const logged=!!state.usuario;
 document.body.classList.toggle('signed-in',logged);
 $('#nav').innerHTML=logged?'<span class="muted" id="greeting"></span><button id="logout" class="btn">Sair</button>':'<a href="#/">Cursos</a><a href="#/entrar">Entrar</a><a class="btn primary" href="#/cadastro">Criar perfil</a>';
 const page=(location.hash||'#/').slice(2).split('/')[0];
 const items=[['','Início'],['progresso','Meu progresso'],['talentos','Banco de Talentos'],['certificados','Meus certificados'],['conta','Meu perfil']];
 $('#sideNav').innerHTML=logged?items.map(([p,label])=>'<a href="#/'+p+'" '+(page===p?'aria-current="page"':'')+'>'+label+'</a>').join(''):'';
 if(logged){$('#greeting').textContent='Olá, '+state.usuario.nome.split(' ')[0];$('#logout').onclick=async()=>{try{await api('logout',{});await refresh();location.hash='#/';render();}catch(e){alert(e.message)}};}
 function closeMenu(){document.body.classList.remove('menu-open');$('#menuToggle').setAttribute('aria-expanded','false')}
 $('#menuToggle').onclick=()=>{document.body.classList.toggle('menu-open');$('#menuToggle').setAttribute('aria-expanded',String(document.body.classList.contains('menu-open')))};
 $('#menuClose').onclick=closeMenu;
 $('#sideBackdrop').onclick=closeMenu;
 $('#sideNav').querySelectorAll('a').forEach(a=>a.onclick=closeMenu);
 if(!logged)closeMenu();
}
const header=(k,t,desc)=>'<div class="eyebrow">'+k+'</div><h1 class="headline">'+t+'</h1><p class="lead">'+desc+'</p>';
function card(c){
 const percent=c.total_aulas?Math.round(c.aulas_concluidas/c.total_aulas*100):0;
 const safety=c.slug==='seguranca-digital';
 return '<article class="card course-card"><div class="course-cover '+(safety?'orange':'blue')+'">'+(safety?'Segurança digital':'Informática básica')+'</div><div class="course-body"><div class="tag">CURSO ONLINE · GRATUITO</div><h2>'+escapeHTML(c.titulo)+'</h2><p class="muted">'+escapeHTML(c.descricao)+'</p><div class="meta">'+c.total_aulas+' aulas · '+c.duracao_minutos+' minutos</div><strong>'+percent+'% concluído</strong><div class="meter" role="progressbar" aria-label="Progresso" aria-valuenow="'+percent+'" aria-valuemin="0" aria-valuemax="100"><span style="width:'+percent+'%"></span></div><p><a class="btn primary" href="#/curso/'+encodeURIComponent(c.slug)+'">'+(percent===100?'Revisar curso':percent?'Continuar curso':'Começar curso')+'</a></p></div></article>';
}
function home(){
 const logged=!!state.usuario, courses=state.cursos,started=courses.filter(c=>Number(c.aulas_concluidas)>0).length,completed=courses.filter(c=>Number(c.total_aulas)>0&&Number(c.aulas_concluidas)===Number(c.total_aulas)).length;
 const resume=courses.find(c=>Number(c.aulas_concluidas)>0&&Number(c.aulas_concluidas)<Number(c.total_aulas))||courses[0];
 const heroTitle=logged&&resume?'Continue aprendendo no seu ritmo':'Aprender conecta. Conhecimento transforma.';
 return '<section class="sc-hero"><div><span class="tag">SE CONECTE · EDUCAÇÃO DIGITAL</span><h1>'+heroTitle+'</h1><p>'+(logged?'Seu progresso fica salvo neste navegador. Continue quando quiser neste dispositivo.':'Aprenda tecnologia e segurança digital com aulas práticas, no seu próprio ritmo.')+'</p><a class="btn" href="'+(logged&&resume?'#/curso/'+encodeURIComponent(resume.slug):'#/cadastro')+'">'+(logged?'Acessar meu curso':'Começar gratuitamente')+'</a></div><div class="hero-art" aria-hidden="true"><div class="hero-screen"></div></div></section>'
 +(logged?'<section class="sc-stats" aria-label="Resumo da aprendizagem"><div class="sc-stat"><strong>'+courses.length+'</strong><span>Cursos disponíveis</span></div><div class="sc-stat"><strong>'+started+'</strong><span>Cursos iniciados</span></div><div class="sc-stat"><strong>'+completed+'</strong><span>Cursos concluídos</span></div></section>':'')
 +'<div class="eyebrow">CATÁLOGO DE CURSOS</div><h2 class="sc-section-title">O que você quer aprender?</h2><p class="lead">Conheça os cursos disponíveis no Se Conecte.</p>'
 +'<div class="grid">'+(logged?courses.map(card).join(''):'<article class="card course-card"><div class="course-cover blue">Informática básica</div><div class="course-body"><div class="tag">CURSO 01</div><h2>Uso Básico do Computador</h2><p class="muted">Aprenda mouse, teclado, arquivos e navegação na internet.</p><div class="meta">4 aulas · 90 minutos</div><a class="btn primary" href="#/cadastro">Começar curso</a></div></article><article class="card course-card"><div class="course-cover orange">Segurança digital</div><div class="course-body"><div class="tag">CURSO 02</div><h2>Segurança na Internet e no Celular</h2><p class="muted">Proteja seus dados, celular, WhatsApp e contas digitais.</p><div class="meta">4 aulas · 80 minutos</div><a class="btn primary" href="#/cadastro">Começar curso</a></div></article>')+'</div>';
}
function auth(register){return '<section class="auth-layout"><div class="auth-promo"><img src="../assets/brand/logo-horizontal.svg" alt="Se Conecte"><span class="tag">SUA JORNADA DIGITAL</span><h2>Aprender conecta.<br>Conhecimento transforma.</h2><p>Aprenda tecnologia com segurança e acompanhe sua evolução em uma plataforma feita para você.</p></div><div class="card authbox"><div class="eyebrow">Sua jornada começa aqui</div><h1>'+(register?'Criar meu perfil':'Abrir perfil local')+'</h1><p class="muted">Seu progresso é guardado neste navegador e não é sincronizado com outros dispositivos.</p><form id="authForm">'+(register?'<label class="field">Nome completo<input name="nome" autocomplete="name" maxlength="120" required></label>':'')+'<label class="field">E-mail<input type="email" name="email" autocomplete="email" maxlength="160" required></label><button class="btn primary" type="submit">'+(register?'Criar meu perfil':'Acessar perfil')+'</button></form><div id="message" role="status" aria-live="polite"></div><p class="muted">'+(register?'Já possui conta? <a href="#/entrar">Entrar</a>':'Não tem perfil neste navegador? <a href="#/cadastro">Criar perfil</a>')+'</p></div></section>';}
async function loadCourse(slug){if(!state.detalhes[slug])state.detalhes[slug]=await api('course',null,'&slug='+encodeURIComponent(slug));return state.detalhes[slug];}
function courseView(data){const c=data.curso,lessons=data.aulas,done=lessons.filter(a=>Number(a.concluida)).length;return '<a class="back" href="#/">Voltar aos cursos</a>'+header('Curso · '+c.duracao_minutos+' min',escapeHTML(c.titulo),escapeHTML(c.descricao))+'<div class="detail"><div class="card"><h2>Conteúdo do curso</h2><p class="muted">Complete a atividade de cada aula para avançar. Você pode revisar as aulas quantas vezes quiser.</p>'+lessons.map(a=>'<a class="lesson" href="#/aula/'+encodeURIComponent(c.slug)+'/'+a.id+'"><strong>'+a.ordem+'. '+escapeHTML(a.titulo)+'</strong><small>'+(Number(a.concluida)?'Concluída':'Pendente')+'</small></a>').join('')+'</div><aside class="card side"><h2>Seu progresso</h2><p class="muted">'+done+' de '+lessons.length+' aulas concluídas</p><div class="meter"><span style="width:'+(lessons.length?Math.round(done/lessons.length*100):0)+'%"></span></div>'+(done===lessons.length?'<p><a href="#/certificados">Ver certificado</a></p>':'<p class="muted">Ao concluir, seu certificado ficará disponível neste navegador.</p>')+'</aside></div>';}
function videoPlayer(url) {
 const source=String(url||'').trim();
 let embed='',fallback='';
 try {
   const u=new URL(source,location.href);
   const host=u.hostname.toLowerCase();
   if(u.protocol==='https:' && ['youtube.com','www.youtube.com','m.youtube.com','youtu.be','www.youtube-nocookie.com'].includes(host)){
     const match=u.pathname.match(/^\/(?:embed|shorts|live)\/([a-zA-Z0-9_-]{11})(?:\/|$)/);
     const id=host==='youtu.be'?u.pathname.split('/')[1]:(u.searchParams.get('v')||(match&&match[1]));
     if(/^[a-zA-Z0-9_-]{11}$/.test(id||'')){
       const youtube='https://www.youtube.com/watch?v='+id;
       embed='<iframe src="https://www.youtube-nocookie.com/embed/'+id+'?rel=0" title="Videoaula do YouTube" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>';
       fallback='<p class="video-external">Se o YouTube não permitir a reprodução incorporada, <a href="'+youtube+'" target="_blank" rel="noopener noreferrer">assista ao vídeo no YouTube</a>.</p>';
     }
   } else if(u.origin===location.origin && ['http:','https:'].includes(u.protocol) && /\.(mp4|webm)$/i.test(u.pathname)){
     embed='<video controls preload="metadata" playsinline src="'+escapeHTML(u.href)+'">Seu navegador não suporta vídeos HTML5.</video>';
     fallback='<p class="video-external"><a target="_blank" rel="noopener noreferrer" href="'+escapeHTML(u.href)+'">Abrir vídeo em outra aba</a></p>';
   }
 } catch(e){}
 if(!embed)return '<section aria-label="Videoaula" class="video-box"><div class="video-placeholder"><strong>Videoaula em preparação</strong><p>Assim que uma URL do YouTube ou um arquivo MP4/WebM for cadastrado, o vídeo aparecerá aqui.</p></div></section>';
 return '<section aria-label="Videoaula"><div class="video-box">'+embed+'</div>'+fallback+'</section>';
}
function lessonView(data,id){const l=data.aulas.find(a=>a.id===Number(id));if(!l)return '<h1>Aula não encontrada</h1><a href="#/curso/'+encodeURIComponent(data.curso.slug)+'">Voltar ao curso</a>';return '<a class="back" href="#/curso/'+encodeURIComponent(data.curso.slug)+'">Voltar ao curso</a>'+header('Aula '+l.ordem,escapeHTML(l.titulo),escapeHTML(data.curso.titulo))+'<div class="detail"><section class="card"><h2>Videoaula</h2>'+videoPlayer(l.video_url)+'<h2>O que você vai aprender</h2><div class="content">'+escapeHTML(l.conteudo)+'</div><hr style="border:0;border-top:1px solid #e6e9ef;margin:28px 0"><h2>Atividade de fixação</h2><p>'+escapeHTML(l.atividade_pergunta)+'</p><form id="lessonForm">'+['A','B','C'].map(k=>'<label class="choice"><input type="radio" name="resposta" value="'+k+'" required>'+escapeHTML(l['opcao_'+k.toLowerCase()])+'</label>').join('')+'<button class="btn primary" type="submit">'+(Number(l.concluida)?'Revisar resposta':'Concluir aula')+'</button></form><div id="message" role="status" aria-live="polite"></div></section><aside class="card side"><div class="tag">Material de estudo</div><h2>Aprenda no seu ritmo</h2><p class="muted">Leia com calma e responda à atividade. Se errar, revise o conteúdo e tente novamente.</p></aside></div>';}
function certificateView(rec){const date=new Date(rec.emitido_em.replace(' ','T')).toLocaleDateString('pt-BR');return '<div class="noprint"><a class="back" href="#/certificados">Voltar aos certificados</a><h1>Certificado de conclusão</h1><p class="muted">Para baixar, escolha “Salvar como PDF” na janela de impressão.</p></div><article class="cert"><img class="cert-logo" src="../assets/brand/logo-horizontal.svg" alt="Se Conecte"><div class="eyebrow">Educação digital</div><h2>Certificado de conclusão</h2><p>Certificamos que</p><div class="cert-name">'+escapeHTML(rec.nome_emitido)+'</div><p>concluiu o curso</p><div class="cert-course">'+escapeHTML(rec.titulo_emitido)+'</div><p>com '+rec.total_aulas+' aulas, na plataforma Se Conecte.</p><p>Gerado localmente em '+date+'</p><p class="muted">Documento gerado neste navegador, sem validação online.</p><div style="border-top:1px solid #d4dff3;margin:35px auto 15px;max-width:440px;padding-top:18px"><strong>Se Conecte</strong><p class="cert-code">Código único: '+escapeHTML(rec.codigo)+'</p></div></article><div class="noprint"><button class="btn primary" id="print">Imprimir / Salvar como PDF</button></div>';}
function talentPage(data){
 const p=data.perfil||{};
 const availability=p.disponibilidade||'qualquer';
 const modes=[['qualquer','Qualquer modalidade'],['presencial','Presencial'],['remoto','Remoto'],['hibrido','Híbrido']];
 const vagas=[
  {titulo:'Auxiliar Administrativo',empresa:'Empresa Horizonte (fictícia)',local:'Marília · SP',tipo:'Presencial',descricao:'Organização de documentos, planilhas básicas e apoio às rotinas de escritório.',requisitos:'Noções de computador e comunicação.'},
  {titulo:'Atendente de Suporte Digital',empresa:'Conecta Serviços (fictícia)',local:'Remoto',tipo:'Remoto',descricao:'Orientação inicial sobre aplicativos e registro de solicitações de atendimento.',requisitos:'Conhecimentos de internet e atendimento.'},
  {titulo:'Assistente de Cadastro',empresa:'Nova Jornada (fictícia)',local:'Marília · SP',tipo:'Híbrido',descricao:'Atualização de registros e conferência de informações em sistemas administrativos.',requisitos:'Atenção aos detalhes e noções de informática.'},
  {titulo:'Auxiliar de Loja',empresa:'Comércio Integra (fictícia)',local:'Marília · SP',tipo:'Presencial',descricao:'Apoio ao atendimento, consulta de produtos e organização de pedidos.',requisitos:'Comunicação e disposição para aprender.'}
 ];
 const jobs='<section aria-labelledby="jobsTitle" class="jobs-section"><div class="eyebrow">OPORTUNIDADES</div><h2 id="jobsTitle" class="sc-section-title">Vagas e oportunidades</h2><p class="muted">Vagas fictícias para exemplificar oportunidades profissionais. Não há empresas contratando por esta página nem envio de candidaturas.</p><div class="job-grid">'+vagas.map(v=>'<article class="card job-card"><div class="tag">'+escapeHTML(v.tipo)+'</div><h3>'+escapeHTML(v.titulo)+'</h3><p class="job-company">'+escapeHTML(v.empresa)+'</p><p class="muted">'+escapeHTML(v.local)+'</p><p>'+escapeHTML(v.descricao)+'</p><p class="job-requirements"><strong>Perfil:</strong> '+escapeHTML(v.requisitos)+'</p><span class="job-notice">Vaga fictícia · apenas referência</span></article>').join('')+'</div></section>';
 return header('BANCO DE TALENTOS','Conecte seu aprendizado a oportunidades','Conheça oportunidades e organize seu perfil profissional. Os dados ficam salvos apenas neste navegador.')
 +'<div class="talent-grid"><section class="card"><div class="tag">PERFIL PROFISSIONAL</div><h2>Meu perfil de talentos</h2><p class="muted">Aluno: '+escapeHTML(state.usuario.nome)+'</p><form id="talentForm"><label class="field">Cidade<input name="cidade" maxlength="120" value="'+escapeHTML(p.cidade||'')+'" placeholder="Ex.: Marília - SP"></label><label class="field">Objetivo profissional<input name="objetivo" maxlength="180" value="'+escapeHTML(p.objetivo||'')+'" placeholder="Ex.: primeiro emprego na área administrativa"></label><label class="field">Habilidades e interesses<textarea name="habilidades" rows="4" maxlength="1500" placeholder="Conte o que aprendeu e suas competências">'+escapeHTML(p.habilidades||'')+'</textarea></label><label class="field">Modalidade de trabalho<select name="disponibilidade">'+modes.map(([key,label])=>'<option value="'+key+'" '+(key===availability?'selected':'')+'>'+label+'</option>').join('')+'</select></label><button class="btn primary" type="submit">Salvar perfil</button><div id="message" role="status" aria-live="polite"></div></form></section><aside class="card"><div class="tag">COMPETÊNCIAS CONCLUÍDAS</div><h2>Minhas formações</h2>'+(state.certificados.length?state.certificados.map(r=>'<p><strong>'+escapeHTML(r.titulo_emitido)+'</strong><br><small>Certificado disponível</small></p>').join(''):'<p class="muted">Conclua um curso para adicionar sua primeira formação.</p>')+'<p><a class="btn" href="#/certificados">Meus certificados</a></p></aside></div>'+jobs;
}

function bindTalent(){
 const form=$('#talentForm');if(!form)return;
 form.onsubmit=async e=>{
  e.preventDefault();
  const fd=new FormData(form),btn=form.querySelector('button[type=submit]');
  btn.disabled=true;
  try{
   await api('talento_salvar',{cidade:fd.get('cidade'),objetivo:fd.get('objetivo'),habilidades:fd.get('habilidades'),disponibilidade:fd.get('disponibilidade'),autorizo_contato:fd.has('autorizo_contato')});
   note('Perfil salvo neste navegador.');
  }catch(err){note(err.message,true)}
  finally{btn.disabled=false}
 };
}
function progressView(){
 const courses=state.cursos,completed=courses.filter(c=>Number(c.total_aulas)>0&&Number(c.aulas_concluidas)===Number(c.total_aulas)).length,totalLessons=courses.reduce((n,c)=>n+Number(c.total_aulas||0),0),done=courses.reduce((n,c)=>n+Number(c.aulas_concluidas||0),0),percent=totalLessons?Math.round(done/totalLessons*100):0;
 return header('MEU PROGRESSO','Sua evolução em um só lugar','Acompanhe as aulas concluídas e os certificados salvos neste navegador.')+'<section class="sc-stats"><div class="sc-stat"><strong>'+percent+'%</strong><span>Progresso geral</span></div><div class="sc-stat"><strong>'+done+' / '+totalLessons+'</strong><span>Aulas concluídas</span></div><div class="sc-stat"><strong>'+completed+'</strong><span>Cursos concluídos</span></div></section><h2 class="sc-section-title">Meus cursos</h2><div class="grid">'+(courses.map(card).join('')||'<div class="card">Nenhum curso disponível.</div>')+'</div><div class="card" style="margin-top:22px"><h2>Certificados</h2><p class="muted">Você possui '+state.certificados.length+' certificado(s) emitido(s).</p><a class="btn" href="#/certificados">Ver meus certificados</a></div>';
}
function certificatePreview(){return '<div class="noprint"><a class="back" href="#/certificados">Voltar aos certificados</a><h1>Modelo de certificado digital</h1><p class="muted">Prévia do layout do certificado. A emissão acontece após a conclusão do curso.</p></div><article class="cert"><img class="cert-logo" src="../assets/brand/logo-horizontal.svg" alt="Se Conecte"><div class="demo-watermark">MODELO</div><div class="eyebrow">Educação digital</div><h2>Certificado de conclusão</h2><p>Certificamos que</p><div class="cert-name">Nome completo do aluno</div><p>concluiu o curso</p><div class="cert-course">Uso Básico do Computador</div><p>com 4 aulas, na plataforma Se Conecte.</p><p>Data de emissão: DD/MM/AAAA</p><div style="border-top:1px solid #d4dff3;margin:35px auto 15px;max-width:440px;padding-top:18px"><strong>Se Conecte</strong><p class="cert-code">Código: GERADO APÓS CONCLUSÃO</p></div></article><p class="noprint muted">O certificado definitivo é gerado automaticamente e disponível no seu perfil após a conclusão das aulas.</p>';}
function certs(){return header('Sua formação','Meus certificados','Os certificados são emitidos automaticamente após a conclusão de todas as aulas e ficam disponíveis neste navegador.')+'<p><a class="btn" href="#/certificado-modelo">Visualizar modelo de certificado</a></p>'+(state.certificados.length?'<div class="grid">'+state.certificados.map(r=>'<article class="card"><span class="tag">Curso concluído</span><h2>'+escapeHTML(r.titulo_emitido)+'</h2><p class="muted">'+escapeHTML(r.nome_emitido)+'</p><a class="btn primary" href="#/certificado/'+encodeURIComponent(r.codigo)+'">Ver certificado</a></article>').join('')+'</div>':'<div class="card empty"><h2>Você ainda não possui certificados</h2><p class="muted">Conclua um dos cursos para receber seu primeiro certificado.</p><a class="btn primary" href="#/">Explorar cursos</a></div>');}
async function render(){nav();const parts=(location.hash||'#/').slice(2).split('/');const page=parts[0],main=$('#content');main.innerHTML='<p class="muted">Carregando...</p>';try{
 if(!state.usuario&& !['','entrar','cadastro','certificado-modelo'].includes(page)){location.hash='#/entrar';return;}
 if(state.usuario&&['entrar','cadastro'].includes(page)){location.hash='#/';return;}
 if(page==='entrar'||page==='cadastro'){const reg=page==='cadastro';main.innerHTML=auth(reg);$('#authForm').onsubmit=async e=>{e.preventDefault();const btn=$('#authForm button');btn.disabled=true;try{const fd=new FormData(e.currentTarget);await api(reg?'register':'login',Object.fromEntries(fd));await refresh();location.hash='#/';render();}catch(err){note(err.message,true)}finally{btn.disabled=false;}};}
 else if(page==='curso'&&parts[1])main.innerHTML=courseView(await loadCourse(decodeURIComponent(parts[1])));
 else if(page==='aula'&&parts[1]&&parts[2]){const slug=decodeURIComponent(parts[1]),data=await loadCourse(slug);main.innerHTML=lessonView(data,parts[2]);const form=$('#lessonForm');if(form)form.onsubmit=async e=>{e.preventDefault();const btn=form.querySelector('button');btn.disabled=true;try{const response=await api('lesson',{aula_id:Number(parts[2]),resposta:new FormData(form).get('resposta')});delete state.detalhes[slug];await refresh();note(response.certificado_emitido?'Parabéns! Curso concluído e certificado emitido.':'Resposta correta! Aula concluída.');setTimeout(()=>{location.hash=response.certificado_emitido?'#/certificados':'#/curso/'+slug;render();},900);}catch(err){note(err.message,true)}finally{btn.disabled=false}};}
 else if(page==='progresso')main.innerHTML=progressView();
 else if(page==='talentos'){const dados=await api('talento');main.innerHTML=talentPage(dados);bindTalent();}
 else if(page==='certificados')main.innerHTML=certs();
 else if(page==='certificado-modelo')main.innerHTML=certificatePreview();
 else if(page==='certificado'&&parts[1]){const rec=state.certificados.find(r=>r.codigo===decodeURIComponent(parts[1]));main.innerHTML=rec?certificateView(rec):'<h1>Certificado não encontrado</h1><a href="#/certificados">Voltar</a>';if(rec)$('#print').onclick=()=>window.print();}
 else if(page==='conta')main.innerHTML=header('Meu perfil','Meu perfil','Dados associados ao seu aprendizado.')+'<div class="card"><p><strong>Nome:</strong> '+escapeHTML(state.usuario.nome)+'</p><p><strong>E-mail:</strong> '+escapeHTML(state.usuario.email)+'</p><p><strong>Certificados:</strong> '+state.certificados.length+'</p><p class="muted">Os dados deste perfil ficam salvos neste navegador e não são sincronizados.</p></div>';
 else main.innerHTML=home();
 document.title=(page==='talentos'?'Banco de Talentos':page==='certificados'?'Meus certificados':page==='conta'?'Meu perfil':'Se Conecte')+' | Se Conecte';
 }catch(e){main.innerHTML='<div class="card"><h1>Não foi possível carregar</h1><p>'+escapeHTML(e.message)+'</p><button class="btn" id="retry">Tentar novamente</button></div>';$('#retry').onclick=()=>render();}}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});refresh().then(render).catch(e=>{$('#content').innerHTML='<div class="card"><h1>Configuração necessária</h1><p>Não foi possível iniciar seus perfis. Atualize a página com Ctrl+F5; se continuar, permita armazenamento de dados do site.</p><p class="muted">'+escapeHTML(e.message)+'</p><p><a class="btn primary" href="../">Voltar ao início</a></p></div>'});
</script><script src="accessibility.js"></script></body></html>
