<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#ffffff"><title>Se Conecte | Aprenda tecnologia</title><link rel="icon" type="image/svg+xml" href="../assets/brand/icon.svg">
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#202124;background:#f8fafd;font-size:16px}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}a{color:#0b57d0;text-decoration:none}a:hover{text-decoration:underline}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #0b57d0;outline-offset:3px}.shell{max-width:1120px;margin:auto;padding:0 24px}.top{height:76px;background:white;border-bottom:1px solid #e7e9ee;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand img{display:block;width:180px;max-width:100%;height:48px;object-fit:contain;object-position:left center}.brand{font-weight:700;letter-spacing:-.7px;font-size:23px;color:#202124}.brand span{color:#0b57d0}.nav{display:flex;gap:24px;align-items:center}.nav a{color:#475467;font-size:14px}.btn{border:1px solid #dadce0;border-radius:7px;padding:12px 19px;background:white;color:#174ea6;font-weight:600;display:inline-block}.btn.primary{background:#0b57d0;color:white;border-color:#0b57d0}.btn:disabled{opacity:.55;cursor:not-allowed}.page{padding-top:45px;padding-bottom:80px}.eyebrow{color:#0b57d0;font-weight:700;letter-spacing:1.6px;font-size:12px;text-transform:uppercase}.headline{font-size:clamp(32px,4.8vw,48px);letter-spacing:-1.7px;line-height:1.15;margin:13px 0 14px;font-weight:650}.lead{color:#5f6368;font-size:17px;line-height:1.7;max-width:680px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:36px}.card{background:white;border:1px solid #e3e7ee;border-radius:13px;padding:28px}.card h2{font-size:22px;letter-spacing:-.4px;margin:12px 0}.muted{color:#667085;line-height:1.65}.tag{font-size:12px;text-transform:uppercase;letter-spacing:1px;font-weight:700;color:#0b57d0}.meta{margin:20px 0;color:#667085;font-size:14px}.meter{height:7px;background:#e9edf3;border-radius:100px;overflow:hidden;margin-top:15px}.meter span{display:block;height:100%;background:#0b57d0}.authbox{max-width:470px;margin:45px auto}.field{display:block;margin:18px 0;font-size:14px;font-weight:600}.field input{display:block;width:100%;margin-top:9px;border:1px solid #c8cdd7;border-radius:7px;padding:14px;background:#fff}.notice{padding:13px 16px;background:#edf3ff;border-radius:7px;color:#174ea6;margin:18px 0}.error{background:#fce8e6;color:#b3261e}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.lesson{display:block;padding:20px 18px;border-bottom:1px solid #e8eaed;color:#202124}.lesson:hover{background:#f7f9fd;text-decoration:none}.lesson:last-child{border-bottom:0}.lesson small{display:block;color:#667085;margin-top:6px}.detail{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:24px;margin-top:26px}.side{align-self:start}.content{white-space:pre-line;line-height:1.85;color:#344054;font-size:17px}.choice{display:block;border:1px solid #dadce0;border-radius:8px;padding:14px;margin:12px 0}.choice input{margin-right:10px}.cert{background:white;padding:55px 36px;text-align:center;border:2px solid #d4dff3;outline:1px solid #d4dff3;outline-offset:-12px;margin:30px auto;max-width:850px}.cert-logo{width:260px;max-width:75%;height:auto;margin:0 auto 18px;display:block}.cert h2{font-size:32px;letter-spacing:-1px;color:#174ea6;margin:30px 0}.cert-name{font-size:29px;font-weight:700;margin:24px 0}.cert-course{font-size:23px;font-weight:650;margin:22px 0}.cert-code{font-size:12px;color:#667085;overflow-wrap:anywhere}.spaced{display:flex;justify-content:space-between;gap:20px;align-items:center}.footer{border-top:1px solid #e6e9ef;padding:26px 0;color:#667085;font-size:13px;background:white}.empty{padding:35px;text-align:center}.skip{position:absolute;top:-60px;left:10px}.skip:focus{top:8px}.back{display:inline-block;margin-bottom:18px}#message:empty{display:none}@media(max-width:750px){.nav{gap:10px}.nav a{font-size:13px}.shell{padding:0 16px}.grid,.detail{grid-template-columns:1fr}.card{padding:22px}.top{height:auto;min-height:66px;flex-wrap:wrap;padding-top:12px;padding-bottom:12px}.page{padding-top:28px}.cert{padding:45px 20px}.cert-name{font-size:23px}}@media print{.top,.footer,.noprint,.btn,#message{display:none!important}body{background:white}.page{padding:0}.cert{margin:0;max-width:none;min-height:90vh;border:2px solid #d4dff3;page-break-inside:avoid}}
</style></head>
<body><a class="skip" href="#content">Pular para conteúdo</a><header class="top shell"><a class="brand" href="#/" aria-label="Se Conecte — início"><img src="../assets/brand/logo-horizontal.svg" alt="Se Conecte" width="180" height="48"></a><nav class="nav" id="nav" aria-label="Navegação principal"></nav></header><main id="content" class="shell page" tabindex="-1"><p>Carregando...</p></main><footer class="footer"><div class="shell">Se Conecte · Educação digital acessível · Conteúdo introdutório</div></footer>
<script>
const $=s=>document.querySelector(s), escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state={csrf:'',usuario:null,cursos:[],certificados:[],detalhes:{}};
async function api(action,data,params=''){
 const res=await fetch('api.php?action='+encodeURIComponent(action)+params,{method:data?'POST':'GET',headers:{'Content-Type':'application/json','X-CSRF-Token':state.csrf},credentials:'same-origin',body:data?JSON.stringify(data):undefined});
 const json=await res.json().catch(()=>({erro:'Resposta inválida do servidor.'}));if(!res.ok)throw Error(json.erro||'Não foi possível concluir.');return json;
}
function note(message,error=false){const n=$('#message');if(n){n.className='notice'+(error?' error':'');n.textContent=message;}}
async function refresh(){const result=await api('bootstrap');state={...state,...result};}
function nav(){const logged=!!state.usuario;$('#nav').innerHTML=logged?'<a href="#/">Início</a><a href="#/certificados">Certificados</a><a href="#/conta">Minha conta</a><button id="logout" class="btn">Sair</button>':'<a href="#/">Cursos</a><a href="#/entrar">Entrar</a><a class="btn primary" href="#/cadastro">Criar conta</a>';if(logged)$('#logout').onclick=async()=>{try{await api('logout',{});await refresh();location.hash='#/';render();}catch(e){alert(e.message)}};}
const header=(k,t,desc)=>'<div class="eyebrow">'+k+'</div><h1 class="headline">'+t+'</h1><p class="lead">'+desc+'</p>';
function card(c){const percent=c.total_aulas?Math.round(c.aulas_concluidas/c.total_aulas*100):0;return '<article class="card"><div class="tag">Curso online · Gratuito</div><h2>'+escapeHTML(c.titulo)+'</h2><p class="muted">'+escapeHTML(c.descricao)+'</p><div class="meta">'+c.total_aulas+' aulas · '+c.duracao_minutos+' minutos · '+percent+'% concluído</div><div class="meter" role="progressbar" aria-label="Progresso" aria-valuenow="'+percent+'" aria-valuemin="0" aria-valuemax="100"><span style="width:'+percent+'%"></span></div><p><a class="btn primary" href="#/curso/'+encodeURIComponent(c.slug)+'">'+(percent===100?'Revisar curso':percent?'Continuar curso':'Começar curso')+'</a></p></article>';}
function home(){return '<div class="home-brand"><img src="../assets/brand/logo-completa.svg" width="580" height="224" style="display:block;max-width:100%;height:auto;margin:0 0 28px" alt="Se Conecte — Plataforma de Cursos"></div>'+header('Aprendizagem digital','Aprenda tecnologia com confiança','Cursos práticos e gratuitos para começar a usar o computador e proteger seus dados na internet.')+(state.usuario?'<p class="muted">Olá, '+escapeHTML(state.usuario.nome)+'. Seu progresso fica salvo na sua conta.</p>':'<div class="row"><a class="btn primary" href="#/cadastro">Criar conta gratuita</a><a class="btn" href="#/entrar">Já tenho conta</a></div>')+'<div class="grid">'+(state.usuario?state.cursos.map(card).join(''):'<article class="card"><span class="tag">Curso 01</span><h2>Primeiros Passos no Computador</h2><p class="muted">Conheça os principais componentes, aprenda a usar mouse e teclado, organize seus arquivos e navegue na internet.</p><p class="meta">4 aulas · 90 minutos</p><a class="btn" href="#/cadastro">Começar</a></article><article class="card"><span class="tag">Curso 02</span><h2>Segurança Digital</h2><p class="muted">Entenda como proteger senhas, identificar golpes, cuidar dos dados e navegar com segurança.</p><p class="meta">4 aulas · 80 minutos</p><a class="btn" href="#/cadastro">Começar</a></article>')+'</div>';}
function auth(register){return '<div class="card authbox"><div class="eyebrow">Sua jornada começa aqui</div><h1>'+(register?'Criar conta':'Entrar na sua conta')+'</h1><p class="muted">Seu aprendizado e certificados ficam vinculados à conta.</p><form id="authForm">'+(register?'<label class="field">Nome completo<input name="nome" autocomplete="name" maxlength="120" required></label>':'')+'<label class="field">E-mail<input type="email" name="email" autocomplete="email" maxlength="160" required></label><label class="field">Senha<input type="password" name="senha" autocomplete="'+(register?'new-password':'current-password')+'" minlength="'+(register?'10':'1')+'" required></label><button class="btn primary" type="submit">'+(register?'Criar conta':'Entrar')+'</button></form><div id="message" role="status" aria-live="polite"></div><p class="muted">'+(register?'Já possui conta? <a href="#/entrar">Entrar</a>':'Não possui conta? <a href="#/cadastro">Cadastre-se</a>')+'</p></div>';}
async function loadCourse(slug){if(!state.detalhes[slug])state.detalhes[slug]=await api('course',null,'&slug='+encodeURIComponent(slug));return state.detalhes[slug];}
function courseView(data){const c=data.curso,lessons=data.aulas,done=lessons.filter(a=>Number(a.concluida)).length;return '<a class="back" href="#/">Voltar aos cursos</a>'+header('Curso · '+c.duracao_minutos+' min',escapeHTML(c.titulo),escapeHTML(c.descricao))+'<div class="detail"><div class="card"><h2>Conteúdo do curso</h2><p class="muted">Complete a atividade de cada aula para avançar. Você pode revisar as aulas quantas vezes quiser.</p>'+lessons.map(a=>'<a class="lesson" href="#/aula/'+encodeURIComponent(c.slug)+'/'+a.id+'"><strong>'+a.ordem+'. '+escapeHTML(a.titulo)+'</strong><small>'+(Number(a.concluida)?'Concluída':'Pendente')+'</small></a>').join('')+'</div><aside class="card side"><h2>Seu progresso</h2><p class="muted">'+done+' de '+lessons.length+' aulas concluídas</p><div class="meter"><span style="width:'+(lessons.length?Math.round(done/lessons.length*100):0)+'%"></span></div>'+(done===lessons.length?'<p><a href="#/certificados">Ver certificado</a></p>':'<p class="muted">Seu certificado será emitido ao concluir todas as aulas.</p>')+'</aside></div>';}
function lessonView(data,id){const l=data.aulas.find(a=>a.id===Number(id));if(!l)return '<h1>Aula não encontrada</h1><a href="#/curso/'+encodeURIComponent(data.curso.slug)+'">Voltar ao curso</a>';return '<a class="back" href="#/curso/'+encodeURIComponent(data.curso.slug)+'">Voltar ao curso</a>'+header('Aula '+l.ordem,escapeHTML(l.titulo),escapeHTML(data.curso.titulo))+'<div class="detail"><section class="card"><h2>O que você vai aprender</h2><div class="content">'+escapeHTML(l.conteudo)+'</div><hr style="border:0;border-top:1px solid #e6e9ef;margin:28px 0"><h2>Atividade de fixação</h2><p>'+escapeHTML(l.atividade_pergunta)+'</p><form id="lessonForm">'+['A','B','C'].map(k=>'<label class="choice"><input type="radio" name="resposta" value="'+k+'" required>'+escapeHTML(l['opcao_'+k.toLowerCase()])+'</label>').join('')+'<button class="btn primary" type="submit">'+(Number(l.concluida)?'Revisar resposta':'Concluir aula')+'</button></form><div id="message" role="status" aria-live="polite"></div></section><aside class="card side"><div class="tag">Material de estudo</div><h2>Aprenda no seu ritmo</h2><p class="muted">Leia com calma e responda à atividade. Se errar, revise o conteúdo e tente novamente.</p></aside></div>';}
function certificateView(rec){const date=new Date(rec.emitido_em.replace(' ','T')).toLocaleDateString('pt-BR');return '<div class="noprint"><a class="back" href="#/certificados">Voltar aos certificados</a><h1>Certificado de conclusão</h1><p class="muted">Para baixar, escolha “Salvar como PDF” na janela de impressão.</p></div><article class="cert"><img class="cert-logo" src="../assets/brand/logo-horizontal.svg" alt="Se Conecte"><div class="eyebrow">Educação digital</div><h2>Certificado de conclusão</h2><p>Certificamos que</p><div class="cert-name">'+escapeHTML(rec.nome_emitido)+'</div><p>concluiu o curso</p><div class="cert-course">'+escapeHTML(rec.titulo_emitido)+'</div><p>com '+rec.total_aulas+' aulas, na plataforma Se Conecte.</p><p>Emitido em '+date+'</p><div style="border-top:1px solid #d4dff3;margin:35px auto 15px;max-width:440px;padding-top:18px"><strong>Se Conecte</strong><p class="cert-code">Código único: '+escapeHTML(rec.codigo)+'</p></div></article><div class="noprint"><button class="btn primary" id="print">Imprimir / Salvar como PDF</button></div>';}
function certs(){return header('Sua formação','Meus certificados','Os certificados são emitidos automaticamente após a conclusão de todas as aulas e ficam associados à sua conta.')+(state.certificados.length?'<div class="grid">'+state.certificados.map(r=>'<article class="card"><span class="tag">Curso concluído</span><h2>'+escapeHTML(r.titulo_emitido)+'</h2><p class="muted">'+escapeHTML(r.nome_emitido)+'</p><a class="btn primary" href="#/certificado/'+encodeURIComponent(r.codigo)+'">Ver certificado</a></article>').join('')+'</div>':'<div class="card empty"><h2>Você ainda não possui certificados</h2><p class="muted">Conclua um dos cursos para receber seu primeiro certificado.</p><a class="btn primary" href="#/">Explorar cursos</a></div>');}
async function render(){nav();const parts=(location.hash||'#/').slice(2).split('/');const page=parts[0],main=$('#content');main.innerHTML='<p class="muted">Carregando...</p>';try{
 if(!state.usuario&& !['','entrar','cadastro'].includes(page)){location.hash='#/entrar';return;}
 if(state.usuario&&['entrar','cadastro'].includes(page)){location.hash='#/';return;}
 if(page==='entrar'||page==='cadastro'){const reg=page==='cadastro';main.innerHTML=auth(reg);$('#authForm').onsubmit=async e=>{e.preventDefault();const btn=$('#authForm button');btn.disabled=true;try{const fd=new FormData(e.currentTarget);await api(reg?'register':'login',Object.fromEntries(fd));await refresh();location.hash='#/';render();}catch(err){note(err.message,true)}finally{btn.disabled=false;}};}
 else if(page==='curso'&&parts[1])main.innerHTML=courseView(await loadCourse(decodeURIComponent(parts[1])));
 else if(page==='aula'&&parts[1]&&parts[2]){const slug=decodeURIComponent(parts[1]),data=await loadCourse(slug);main.innerHTML=lessonView(data,parts[2]);const form=$('#lessonForm');if(form)form.onsubmit=async e=>{e.preventDefault();const btn=form.querySelector('button');btn.disabled=true;try{const response=await api('lesson',{aula_id:Number(parts[2]),resposta:new FormData(form).get('resposta')});delete state.detalhes[slug];await refresh();note(response.certificado_emitido?'Parabéns! Curso concluído e certificado emitido.':'Resposta correta! Aula concluída.');setTimeout(()=>{location.hash=response.certificado_emitido?'#/certificados':'#/curso/'+slug;render();},900);}catch(err){note(err.message,true)}finally{btn.disabled=false}};}
 else if(page==='certificados')main.innerHTML=certs();
 else if(page==='certificado'&&parts[1]){const rec=state.certificados.find(r=>r.codigo===decodeURIComponent(parts[1]));main.innerHTML=rec?certificateView(rec):'<h1>Certificado não encontrado</h1><a href="#/certificados">Voltar</a>';if(rec)$('#print').onclick=()=>window.print();}
 else if(page==='conta')main.innerHTML=header('Meu perfil','Minha conta','Dados associados ao seu aprendizado.')+'<div class="card"><p><strong>Nome:</strong> '+escapeHTML(state.usuario.nome)+'</p><p><strong>E-mail:</strong> '+escapeHTML(state.usuario.email)+'</p><p><strong>Certificados:</strong> '+state.certificados.length+'</p><p class="muted">Seus dados e certificados são armazenados no servidor.</p></div>';
 else main.innerHTML=home();
 document.title=(page==='certificados'?'Meus certificados':page==='conta'?'Minha conta':'Se Conecte')+' | Se Conecte';
 }catch(e){main.innerHTML='<div class="card"><h1>Não foi possível carregar</h1><p>'+escapeHTML(e.message)+'</p><button class="btn" id="retry">Tentar novamente</button></div>';$('#retry').onclick=()=>render();}}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});refresh().then(render).catch(e=>{$('#content').innerHTML='<div class="card"><h1>Configuração necessária</h1><p>Não foi possível conectar ao servidor. Execute o projeto com PHP e importe o banco MySQL.</p><p class="muted">'+escapeHTML(e.message)+'</p></div>'});
</script></body></html>
